[advisories]
unmaintained = "all"
yanked = "deny"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "CC0-1.0",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0cc23d }
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

deny = [
    { name = "openssl", reason = "Use native-tls or pure-rust rustls features instead" }
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = [
    "https://github.com",
    "registry+https://github.com/rust-lang/crates.io-index"
]
