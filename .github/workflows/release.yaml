---
name: build & release job

on:
  workflow_dispatch:

  push:
    branches: [ "release" ]

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: amoret

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
          
          - os: ubuntu-latest
            target: riscv64gc-unknown-linux-musl
          
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          
          - os: windows-latest
            target: aarch64-pc-windows-msvc
          
          - os: macos-15-intel
            target: x86_64-apple-darwin
          
          - os: macos-latest 
            target: aarch64-apple-darwin

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: install nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes

      - name: magic nix cache
        uses: DeterminateSystems/magic-nix-cache-action@55718cd9ebf1737a061487d5ada21abf31e99a98

      - name: build-nt
        if: matrix.is_nt == true
        shell: bash
        run: |
          nix --extra-experimental-features "nix-command flakes" \
            develop --no-pure-eval --accept-flake-config \
            --command cargo xwin build --release --target ${{ matrix.target }}

      - name: build-unix
        if: matrix.is_nt == false
        shell: bash
        run: |
          nix --extra-experimental-features "nix-command flakes" \
            develop --no-pure-eval --accept-flake-config \
            --command cargo zigbuild --release --target ${{ matrix.target }}

      - name: artifact prep
        shell: bash
        run: |
          mkdir -p staging
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/${{ env.BIN_NAME }}.exe staging/
          else
            cp target/${{ matrix.target }}/release/${{ env.BIN_NAME }} staging/
          fi
          tar -caf ${{ env.BIN_NAME }}-${{ matrix.target }}.tar.zstd -C staging .

      - name: attest build
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: ${{ env.BIN_NAME }}-${{ matrix.target }}.tar.zstd

      - name: attest upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.target }}
          path: ${{ env.BIN_NAME }}-${{ matrix.target }}.tar.zstd

  release:
    name: release
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: chechout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: fetch artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: release-assets
          merge-multiple: true

      - name: car go version
        id: cargo_version
        uses: cssnr/toml-action@fde2b2f22f30923c248d1bddc1e431437d6e314f
        with:
          file: ./Cargo.toml
          path: package.version

      - name: gha release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          token: ${{ secrets.GHA_TOKEN }}
          files: release-assets/*.tar.zstd
          generate_release_notes: true
          tag_name: "v${{ steps.cargo_version.outputs.value }}"
...
