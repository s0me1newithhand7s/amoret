---
on:
  push:
    branches: [ "release" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "release" ]

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: amoret

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            use_cross: true
          
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            use_cross: true
          
          - os: ubuntu-latest
            target: riscv64gc-unknown-linux-musl
            use_cross: true
          
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            use_cross: false
          
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            use_cross: false
          
          - os: macos-13
            target: x86_64-apple-darwin
            use_cross: false
          
          - os: macos-latest 
            target: aarch64-apple-darwin
            use_cross: false

    steps:
      - name: chechout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: rust toolchain
        uses: dtolnay/rust-toolchain@b2b36207fb4d11c9373a6e7c38b6f5f2e4ea0f9e
        with:
          targets: ${{ matrix.target }}

      - name: win-llvm
        if: runner.os == 'Windows'
        uses: rlalik/setup-lld@8a3a06a55853b7b8eb498ba5d743b9563eb8b77b
        
      - name: cross-rs
        if: matrix.use_cross == true
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: build
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: artifact prep
        shell: bash
        run: |
          mkdir -p staging
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/${{ env.BIN_NAME }}.exe staging/
          else
            cp target/${{ matrix.target }}/release/${{ env.BIN_NAME }} staging/
          fi
          tar --zstd -czvf ${{ env.BIN_NAME }}-${{ matrix.target }}.tar.zstd -C staging .

      - name: attest build
        uses: actions/attest-build-provenance@7668a9d9f0d2adc10a482c9562e8c33f5fea4ab7
        with:
          subject-path: ${{ env.BIN_NAME }}-${{ matrix.target }}.tar.zstd

      - name: attest upload
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.target }}
          path: ${{ env.BIN_NAME }}-${{ matrix.target }}.tar.zstd

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: fetch artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          path: release-assets
          merge-multiple: true

      - name: gha release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631
        with:
          token: ${{ secrets.PAT_TOKEN }}
          files: release-assets/*.tar.zstd
          generate_release_notes: true
---
