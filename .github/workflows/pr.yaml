---
name: pr handle job

on:
  workflow_dispatch:

  merge_group:
  
  pull_request:
    branches: [ "*" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: amoret

permissions:
  contents: read

jobs:
  lint:
    name: linting
    runs-on: ubuntu-latest
    steps:
      - name: checkput
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: install nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes

      - name: cargo update
        shell: bash
        run: |
          mkdir -p "./.devenv"
          
          printf "%s" "$PWD" > "./.devenv/root"

          nix --extra-experimental-features "nix-command flakes" \
            develop .#default --no-pure-eval \
            --accept-flake-config \
            --override-input devenv-root "file+file://$(pwd)/.devenv/root" \
            --command cargo fetch --locked

      - name: linter run
        shell: bash
        run: |
          mkdir -p "./.devenv"
          
          printf "%s" "$PWD" > "./.devenv/root"

          nix --extra-experimental-features "nix-command flakes" \
            develop .#default --no-pure-eval \
            --accept-flake-config \
            --override-input devenv-root "file+file://$(pwd)/.devenv/root" \
            --command prek run --fail-fast --all-files

  matrix-test-build-run:
    name: fail-slow (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
          
          - os: ubuntu-latest
            target: riscv64gc-unknown-linux-musl
          
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          
          - os: windows-latest
            target: aarch64-pc-windows-msvc
          
          - os: macos-15-intel
            target: x86_64-apple-darwin
          
          - os: macos-latest 
            target: aarch64-apple-darwin

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          targets: ${{ matrix.target }}
          toolchain: stable

      - name: cargo-zigbuild
        run: cargo install cargo-zigbuild --locked --git https://github.com/rust-cross/cargo-zigbuild

      - name: zig install
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29        

      - name: build
        shell: bash
        run: argo zigbuild --release --target ${{ matrix.target }}

  all-tests-passed:
    name: req - no jobs failed
    needs: [ lint, matrix-test-build-run ]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      statuses: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        with:
          script: |
            const { serverUrl, repo, runId, payload } = context
            const target_url = `${serverUrl}/${repo.owner}/${repo.repo}/actions/runs/${runId}`
            
            const resultsObj = JSON.parse(process.env.RESULTS);
            const allPassed = Object.values(resultsObj).every(status => status === 'success');
            const state = allPassed ? 'success' : 'error';

            await github.rest.repos.createCommitStatus({
              ...repo,
              sha: context.sha,
              context: 'req - no jobs failed',
              state: state,
              target_url: target_url,
              description: allPassed ? 'All checks passed!' : 'One or more jobs failed.'
            })
...
